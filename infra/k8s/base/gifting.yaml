apiVersion: apps/v1
kind: Deployment
metadata:
  name: gifting
  namespace: growgift
  labels: { app: gifting, part-of: growgift }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gifting }
  template:
    metadata:
      labels: { app: gifting, part-of: growgift }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gifting
          image: ghcr.io/growgift/gifting:latest # pinned by CI to the git SHA
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: growgift-config }
            - secretRef: { name: growgift-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gifting
  namespace: growgift
spec:
  selector: { app: gifting }
  ports:
    - port: 80
      targetPort: 8080
