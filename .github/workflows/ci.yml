name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore backend/GrowGift.sln
      - name: Build
        run: dotnet build backend/GrowGift.sln --no-restore -c Release
      - name: Domain tests
        run: dotnet test backend/tests/GrowGift.Domain.Tests -c Release --no-build --logger trx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    needs: [backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { service: gateway,       dockerfile: backend/src/Gateway/GrowGift.Gateway/Dockerfile }
          - { service: identity,      dockerfile: backend/src/Services/Identity/GrowGift.Identity/Dockerfile }
          - { service: catalog,       dockerfile: backend/src/Services/Catalog/GrowGift.Catalog/Dockerfile }
          - { service: gifting,       dockerfile: backend/src/Services/Gifting/GrowGift.Gifting/Dockerfile }
          - { service: brokerage,     dockerfile: backend/src/Services/Brokerage/GrowGift.Brokerage/Dockerfile }
          - { service: family,        dockerfile: backend/src/Services/Family/GrowGift.Family/Dockerfile }
          - { service: fulfillment,   dockerfile: backend/src/Services/Fulfillment/GrowGift.Fulfillment/Dockerfile }
          - { service: notifications, dockerfile: backend/src/Services/Notifications/GrowGift.Notifications/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/growgift/${{ matrix.service }}:${{ github.sha }}
